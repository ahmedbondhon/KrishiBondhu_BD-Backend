# ============================================================================
# KrishiBondhu Bangladesh — Alembic Configuration
# ============================================================================

[alembic]
# Path to migration versions
script_location = alembic
# Database URL (overridden in env.py from settings)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/krishibondhu
# Truncate long revision IDs
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
